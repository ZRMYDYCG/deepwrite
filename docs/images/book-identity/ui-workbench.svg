  <text class="ct" x="270" y="192">作品</text>
  <rect x="270" y="204" width="248" height="30" rx="8" fill="#F1EFE8"/>
  <rect x="273" y="207" width="58" height="24" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
