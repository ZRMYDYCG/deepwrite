<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="800" viewBox="0 0 1000 800" role="img">
  <title>书名·简介·封面进程与数据流</title>
  <desc>Renderer 只发契约命令；Main 解析档案、作品快照与设计上下文，授权智能体提交并持有图片 Key；Agent Utility 只读作品并提交一轮候选；Core 是作品文件夹 book-identity 目录的唯一写入者；封面图片经 Main 的图片服务生成，经 deepwrite-cover 协议只读显示。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .h1 { font-size: 20px; font-weight: 600; }
      .lead { font-size: 13px; fill: #5F5E5A; }
      .bt { font-size: 15px; font-weight: 600; }
      .sbt { font-size: 13.5px; font-weight: 600; }
      .sbs { font-size: 12px; }
      .lbl { font-size: 12px; fill: #5F5E5A; }
      .num { font-size: 12px; font-weight: 600; fill: #2C2C2A; }
      .step { font-size: 12.5px; }
      .r-t { fill: #0C447C; } .r-s { fill: #185FA5; }
      .m-t { fill: #2C2C2A; } .m-s { fill: #5F5E5A; }
      .a-t { fill: #3C3489; } .a-s { fill: #534AB7; }
      .c-t { fill: #085041; } .c-s { fill: #0F6E56; }
      .e-t { fill: #633806; } .e-s { fill: #854F0B; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="800" fill="#FFFFFF"/>
  <text class="h1" x="40" y="44">书名·简介·封面 · 进程与数据流</text>
  <text class="lead" x="40" y="68">沿用扩展智能体服务：Renderer 只发契约命令，凭据只在 Main 与 Agent，Core 是作品文件夹的唯一写入者</text>

  <!-- Renderer -->
  <rect x="40" y="92" width="920" height="118" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
  <text class="bt r-t" x="60" y="118">Renderer · extras/book-identity/ 与设置页</text>
  <g fill="#FFFFFF" stroke="#85B7EB">
    <rect x="60" y="132" width="280" height="64" rx="8"/>
    <rect x="360" y="132" width="280" height="64" rx="8"/>
    <rect x="660" y="132" width="280" height="64" rx="8"/>
  </g>
  <text class="sbt r-t" x="200" y="157" text-anchor="middle">书名·简介·封面页面</text>
  <text class="sbs r-s" x="200" y="181" text-anchor="middle">作品选择 · 三点概览 · 候选与采用 · 排版</text>
  <text class="sbt r-t" x="500" y="157" text-anchor="middle">运行与出图队列</text>
  <text class="sbs r-s" x="500" y="181" text-anchor="middle">startExtrasAgentTask · 出图并发 2</text>
  <text class="sbt r-t" x="800" y="157" text-anchor="middle">设置 · 图片模型</text>
  <text class="sbs r-s" x="800" y="181" text-anchor="middle">预设 · Key · 测试出图 · 用量</text>

  <!-- Preload -->
  <rect x="40" y="232" width="920" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text class="sbs m-t" x="500" y="257" text-anchor="middle">Preload · extrasAgents.run · bookIdentity.* · imageModels.*（请求与响应双向校验）</text>

  <g stroke="#73726C" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="430" y1="196" x2="430" y2="230"/>
    <line x1="570" y1="196" x2="570" y2="230"/>
    <line x1="800" y1="196" x2="800" y2="230"/>
    <line x1="140" y1="272" x2="140" y2="294"/>
    <line x1="666" y1="272" x2="666" y2="294"/>
  </g>
  <text class="num" x="420" y="218" text-anchor="end">①</text>
  <text class="num" x="580" y="218">⑤</text>
  <text class="lbl" x="810" y="218">配置</text>

  <!-- Main -->
  <rect x="40" y="296" width="720" height="150" rx="12" fill="#F1EFE8" stroke="#888780"/>
  <text class="bt m-t" x="60" y="322">Main · 档案与授权 · 图片 Key 只在这里</text>
  <g fill="#FFFFFF" stroke="#B4B2A9">
    <rect x="60" y="336" width="160" height="94" rx="8"/>
    <rect x="236" y="336" width="160" height="94" rx="8"/>
    <rect x="412" y="336" width="160" height="94" rx="8"/>
    <rect x="588" y="336" width="156" height="94" rx="8"/>
  </g>
  <text class="sbt m-t" x="140" y="360" text-anchor="middle">任务解析</text>
  <text class="sbs m-s" x="140" y="382" text-anchor="middle">档案 · 作品快照</text>
  <text class="sbs m-s" x="140" y="400" text-anchor="middle">设计上下文</text>
  <text class="sbs m-s" x="140" y="418" text-anchor="middle">预分配 roundId</text>
  <text class="sbt m-t" x="316" y="360" text-anchor="middle">提交授权</text>
  <text class="sbs m-s" x="316" y="382" text-anchor="middle">bookIdentity.submitRound</text>
  <text class="sbs m-s" x="316" y="400" text-anchor="middle">核对运行 · 字段 · 数量</text>
  <text class="sbs m-s" x="316" y="418" text-anchor="middle">每次运行只提交一次</text>
  <text class="sbt m-t" x="492" y="360" text-anchor="middle">deepwrite-cover:</text>
  <text class="sbs m-s" x="492" y="382" text-anchor="middle">只读图片协议</text>
  <text class="sbs m-s" x="492" y="400" text-anchor="middle">仅 GET · 校验 ID</text>
  <text class="sbs m-s" x="492" y="418" text-anchor="middle">限定 book-identity/</text>
  <text class="sbt m-t" x="666" y="360" text-anchor="middle">图片服务</text>
  <text class="sbs m-s" x="666" y="382" text-anchor="middle">Key 解密 · 协议适配</text>
  <text class="sbs m-s" x="666" y="400" text-anchor="middle">下载校验 · 缩略图</text>
  <text class="sbs m-s" x="666" y="418" text-anchor="middle">超时 · 重试 · 用量</text>

  <!-- image providers -->
  <rect x="780" y="296" width="180" height="150" rx="12" fill="#FAEEDA" stroke="#BA7517"/>
  <text class="sbt e-t" x="870" y="322" text-anchor="middle">图片服务</text>
  <text class="sbs e-s" x="870" y="346" text-anchor="middle">火山方舟 · Seedream</text>
  <text class="sbs e-s" x="870" y="366" text-anchor="middle">阿里云百炼 · 通义</text>
  <text class="sbs e-s" x="870" y="386" text-anchor="middle">硅基流动</text>
  <text class="sbs e-s" x="870" y="406" text-anchor="middle">智谱 · CogView</text>
  <text class="sbs e-s" x="870" y="426" text-anchor="middle">OpenAI 兼容</text>
  <line x1="746" y1="383" x2="778" y2="383" stroke="#73726C" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- protocol direct to renderer -->
  <line x1="492" y1="334" x2="492" y2="198" stroke="#73726C" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="num" x="500" y="290">⑥</text>

  <!-- Agent -->
  <rect x="40" y="480" width="410" height="140" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
  <text class="bt a-t" x="60" y="506">Agent Utility · 扩展域</text>
  <rect x="60" y="520" width="370" height="84" rx="8" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text class="sbt a-t" x="245" y="544" text-anchor="middle">书名设计 · 简介设计 · 封面设计</text>
  <text class="sbs a-s" x="245" y="566" text-anchor="middle">档案提示词 + 不可编辑的运行边界</text>
  <text class="sbs a-s" x="245" y="586" text-anchor="middle">作品只读工具 · submit_book_identity_candidates</text>

  <!-- Core -->
  <rect x="470" y="480" width="490" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="bt c-t" x="490" y="506">Core Utility · 唯一写入者</text>
  <g fill="#FFFFFF" stroke="#5DCAA5">
    <rect x="490" y="520" width="210" height="84" rx="8"/>
    <rect x="716" y="520" width="226" height="84" rx="8"/>
  </g>
  <text class="sbt c-t" x="595" y="544" text-anchor="middle">作品注册表 · 只读桥</text>
  <text class="sbs c-s" x="595" y="566" text-anchor="middle">短篇 · 剧本 · 长篇</text>
  <text class="sbs c-s" x="595" y="586" text-anchor="middle">供读作品工具使用</text>
  <text class="sbt c-t" x="829" y="544" text-anchor="middle">book-identity 存储</text>
  <text class="sbs c-s" x="829" y="566" text-anchor="middle">每本书一个写队列 · 原子写入</text>
  <text class="sbs c-s" x="829" y="586" text-anchor="middle">identity.json · covers/ · cover.png</text>

  <!-- Main <-> Agent -->
  <g stroke="#73726C" stroke-width="1.4" fill="none">
    <line x1="140" y1="432" x2="140" y2="478" marker-end="url(#arrow)"/>
    <line x1="316" y1="478" x2="316" y2="432" marker-end="url(#arrow)"/>
  </g>
  <text class="num" x="150" y="462">② 运行规格</text>
  <text class="num" x="326" y="462">③ 读作品 · ④ 提交</text>

  <!-- Main <-> Core -->
  <g stroke="#73726C" stroke-width="1.4" fill="none">
    <line x1="560" y1="448" x2="560" y2="478" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="666" y1="432" x2="666" y2="478" marker-end="url(#arrow)"/>
    <line x1="510" y1="478" x2="510" y2="432" marker-end="url(#arrow)"/>
  </g>
  <text class="lbl" x="570" y="468">②③④ 读写</text>
  <text class="num" x="676" y="462">⑤ 写原图与缩略图</text>
  <text class="num" x="470" y="462" text-anchor="end">⑥</text>

  <!-- LLM -->
  <rect x="40" y="652" width="410" height="64" rx="10" fill="#FAEEDA" stroke="#BA7517"/>
  <text class="sbt e-t" x="245" y="678" text-anchor="middle">对话模型</text>
  <text class="sbs e-s" x="245" y="700" text-anchor="middle">所选模型 · 共享运行内核（重试、超时、用量、中止）</text>
  <line x1="245" y1="620" x2="245" y2="650" stroke="#73726C" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- steps -->
  <text class="sbt m-t" x="470" y="660">步骤</text>
  <text class="step" x="470" y="682">① extrasAgent.run：profileId + 作品引用 + 数量与要求</text>
  <text class="step" x="470" y="700">② 解析档案、作品快照、设计上下文，预分配本轮记录</text>
  <text class="step" x="470" y="718">③ 只读工具经 Main 授权读取作品</text>
  <text class="step" x="470" y="736">④ 一次提交 → Main 核对 → Core 原子写入 → 通知界面</text>
  <text class="step" x="470" y="754">⑤ renderCover：Main 调图片服务，Core 写图并挂到候选</text>
  <text class="step" x="470" y="772">⑥ 页面经 deepwrite-cover: 直接载入图片，不经 Preload</text>
</svg>
