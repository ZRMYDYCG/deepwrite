<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="1100" viewBox="0 0 1000 1100" role="img">
  <title>界面线框：封面页签与排版弹层</title>
  <desc>封面页签的生成栏可设置档案、方案数、每套张数、比例、书名处理方式和自动出图，并显示出图预估；候选卡显示已出图、出图中和失败三种状态，方案提示词可在出图前编辑。排版弹层在本地叠加书名、副标题和作者，按原图分辨率合成 PNG。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .sec { font-size: 15px; font-weight: 600; fill: #5F5E5A; }
      .placeholder { font-size: 12.5px; fill: #888780; }
      .ct { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .small { font-size: 12px; fill: #5F5E5A; }
      .tiny { font-size: 11.5px; fill: #5F5E5A; }
      .link { font-size: 12.5px; fill: #185FA5; }
      .danger { font-size: 12.5px; fill: #A32D2D; }
      .btn { font-size: 13px; }
      .btn-p { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .tab { font-size: 14px; fill: #5F5E5A; }
      .tab-a { font-size: 14px; font-weight: 600; }
      .act { font-size: 12px; fill: #444441; }
      .ok { font-size: 11.5px; fill: #0F6E56; font-weight: 600; }
      .err { font-size: 12px; fill: #A32D2D; }
      .ov { font-weight: 700; fill: #F5EBD7; }
      .mono { font-size: 11.5px; fill: #444441; }
    </style>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2A44"/>
      <stop offset="0.7" stop-color="#3D4A6B"/>
      <stop offset="1" stop-color="#C9A86A"/>
    </linearGradient>
    <linearGradient id="skeleton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EFE8"/>
      <stop offset="1" stop-color="#E5E3DA"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1100" fill="#FFFFFF"/>

  <!-- A: cover tab -->
  <text class="sec" x="40" y="34">A · 封面页签（页头、作品选择与三点概览同上图）</text>
  <rect x="20" y="46" width="960" height="626" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="tab" x="40" y="82">书名 24</text>
  <text class="tab" x="116" y="82">简介 6</text>
  <text class="tab-a" x="190" y="82">封面 9</text>
  <rect x="190" y="92" width="50" height="2.5" rx="1" fill="#2C2C2A"/>
  <circle cx="248" cy="77" r="4" fill="#378ADD"/>
  <line x1="40" y1="95" x2="960" y2="95" stroke="#E5E3DA"/>

  <rect x="40" y="110" width="920" height="198" rx="12" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="small" x="60" y="140">档案</text>
  <rect x="94" y="122" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="106" y="142">通用</text>
  <text class="body" x="222" y="142" text-anchor="end">▾</text>
  <text class="link" x="244" y="142">管理档案</text>
  <text class="small" x="330" y="140">方案数</text>
  <rect x="374" y="122" width="96" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="388" y="142" text-anchor="middle">−</text>
  <text class="body" x="422" y="142" text-anchor="middle">3</text>
  <text class="body" x="456" y="142" text-anchor="middle">＋</text>
  <text class="small" x="490" y="140">每套</text>
  <rect x="522" y="122" width="96" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="536" y="142" text-anchor="middle">−</text>
  <text class="body" x="570" y="142" text-anchor="middle">1</text>
  <text class="body" x="604" y="142" text-anchor="middle">＋</text>
  <text class="small" x="638" y="140">比例</text>
  <rect x="670" y="122" width="110" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="682" y="142">3:4 网文</text>
  <text class="body" x="768" y="142" text-anchor="end">▾</text>
  <text class="link" x="940" y="142" text-anchor="end">设为档案默认</text>

  <text class="small" x="60" y="182">书名处理</text>
  <rect x="118" y="164" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="130" y="184">本地排版（无字底图）</text>
  <text class="body" x="306" y="184" text-anchor="end">▾</text>
  <rect x="340" y="170" width="34" height="18" rx="9" fill="#2C2C2A"/>
  <circle cx="365" cy="179" r="7" fill="#FFFFFF"/>
  <text class="body" x="382" y="184">生成后自动出图</text>
  <text class="tiny" x="500" y="184">关闭后先检查提示词，再逐个出图</text>

  <text class="small" x="60" y="218">补充要求</text>
  <rect x="60" y="226" width="880" height="34" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="placeholder" x="72" y="248">冷色调，少年背影，手提一盏暖光的灯；不要怪物正脸</text>

  <text class="muted" x="60" y="284">3 套方案 × 1 张 = 3 张图 · 豆包 Seedream · 约 1–3 分钟</text>
  <rect x="790" y="266" width="150" height="32" rx="8" fill="#2C2C2A"/>
  <text class="btn-p" x="865" y="287" text-anchor="middle">生成 3 套封面方案</text>

  <line x1="40" y1="322" x2="960" y2="322" stroke="#E5E3DA"/>
  <text class="muted" x="40" y="342">10-02 14:40 · 档案 通用 · DeepSeek V3 · 3:4 · 本地排版</text>
  <text class="link" x="872" y="342" text-anchor="end">收起</text>
  <text class="danger" x="960" y="342" text-anchor="end">删除本轮</text>

  <g fill="#FFFFFF" stroke="#E5E3DA">
    <rect x="355" y="356" width="290" height="300" rx="10"/>
    <rect x="670" y="356" width="290" height="300" rx="10"/>
  </g>
  <rect x="40" y="356" width="290" height="300" rx="10" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.5"/>

  <!-- card 1: rendered -->
  <rect x="56" y="372" width="120" height="160" rx="6" fill="url(#g1)"/>
  <text class="ov" x="116" y="402" text-anchor="middle" font-size="15">长夜将明</text>
  <circle cx="116" cy="490" r="8" fill="#F5D58A"/>
  <rect x="188" y="372" width="64" height="86" rx="4" fill="url(#g1)" opacity="0.75"/>
  <text class="tiny" x="188" y="474">另 1 张</text>
  <text class="ct" x="56" y="556">长夜孤灯</text>
  <text class="ok" x="314" y="554" text-anchor="end">已采用</text>
  <rect x="56" y="566" width="16" height="16" rx="3" fill="#1F2A44"/>
  <rect x="76" y="566" width="16" height="16" rx="3" fill="#3D4A6B"/>
  <rect x="96" y="566" width="16" height="16" rx="3" fill="#C9A86A"/>
  <text class="tiny" x="122" y="579">厚涂 · 冷暖对比 · 顶部留白</text>
  <text class="link" x="56" y="606">查看方案 ▸</text>
  <text class="act" x="56" y="636">再出一张 · 排版 · ★ · 导出</text>

  <!-- card 2: rendering -->
  <rect x="371" y="372" width="120" height="160" rx="6" fill="url(#skeleton)"/>
  <circle cx="431" cy="444" r="14" fill="none" stroke="#B4B2A9" stroke-width="3" stroke-dasharray="44 44"/>
  <text class="small" x="431" y="482" text-anchor="middle">出图中 · 42 s</text>
  <text class="ct" x="371" y="556">灯塔废墟</text>
  <rect x="371" y="566" width="16" height="16" rx="3" fill="#2E3B3A"/>
  <rect x="391" y="566" width="16" height="16" rx="3" fill="#6B7F7A"/>
  <rect x="411" y="566" width="16" height="16" rx="3" fill="#E8B04B"/>
  <text class="tiny" x="437" y="579">远景 · 剪影 · 底部留白</text>
  <text class="link" x="371" y="606">查看方案 ▸</text>
  <rect x="371" y="618" width="64" height="26" rx="7" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="403" y="636" text-anchor="middle">停止</text>

  <!-- card 3: failed with expanded prompt -->
  <rect x="686" y="372" width="120" height="160" rx="6" fill="#FBF3F3" stroke="#E8C4C4"/>
  <text class="err" x="746" y="436" text-anchor="middle">出图失败</text>
  <text class="tiny" x="746" y="456" text-anchor="middle">服务限流</text>
  <rect x="716" y="472" width="60" height="26" rx="7" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="746" y="490" text-anchor="middle">重试</text>
  <text class="ct" x="818" y="390">城市夜幕</text>
  <text class="tiny" x="818" y="410">俯视 · 霓虹残光</text>
  <text class="tiny" x="818" y="428">右侧竖排留白</text>
  <text class="link" x="686" y="556">查看方案 ▾</text>
  <rect x="686" y="566" width="258" height="56" rx="6" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="mono" x="696" y="584">俯视废墟城市，夜色中零星暖光，少年站</text>
  <text class="mono" x="696" y="600">在高楼边缘，右侧三分之一干净天空，画面</text>
  <text class="mono" x="696" y="616">不含任何文字……</text>
  <text class="link" x="686" y="644">保存提示词</text>
  <text class="act" x="944" y="644" text-anchor="end">★ · 采用</text>

  <!-- B: composer -->
  <text class="sec" x="40" y="712">B · 封面排版弹层</text>
  <rect x="20" y="724" width="960" height="356" rx="12" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="ct" x="44" y="756">封面排版 · 长夜孤灯</text>
  <text class="body" x="956" y="756" text-anchor="end">×</text>
  <line x1="20" y1="770" x2="980" y2="770" stroke="#E5E3DA"/>

  <rect x="44" y="786" width="276" height="270" rx="8" fill="#F7F6F2"/>
  <rect x="98" y="792" width="168" height="224" rx="4" fill="url(#g1)"/>
  <text class="ov" x="182" y="840" text-anchor="middle" font-size="26">长夜将明</text>
  <text class="ov" x="182" y="862" text-anchor="middle" font-size="11" style="font-weight:400">我在末世点亮第一盏灯</text>
  <circle cx="182" cy="972" r="10" fill="#F5D58A"/>
  <text class="ov" x="182" y="1006" text-anchor="middle" font-size="10" style="font-weight:400">陆 · 著</text>
  <text class="tiny" x="182" y="1040" text-anchor="middle">实时预览 · 原图 1728×2304</text>

  <text class="small" x="344" y="800">版式</text>
  <g fill="#FFFFFF" stroke="#D3D1C7">
    <rect x="344" y="810" width="66" height="54" rx="6" stroke="#2C2C2A" stroke-width="1.5"/>
    <rect x="418" y="810" width="66" height="54" rx="6"/>
    <rect x="492" y="810" width="66" height="54" rx="6"/>
    <rect x="566" y="810" width="66" height="54" rx="6"/>
  </g>
  <rect x="362" y="818" width="30" height="5" rx="2" fill="#888780"/>
  <rect x="436" y="850" width="30" height="5" rx="2" fill="#888780"/>
  <rect x="540" y="818" width="5" height="26" rx="2" fill="#888780"/>
  <rect x="584" y="834" width="30" height="5" rx="2" fill="#888780"/>
  <text class="tiny" x="377" y="880" text-anchor="middle">顶部居中</text>
  <text class="tiny" x="451" y="880" text-anchor="middle">底部横排</text>
  <text class="tiny" x="525" y="880" text-anchor="middle">右侧竖排</text>
  <text class="tiny" x="599" y="880" text-anchor="middle">居中压图</text>

  <text class="small" x="664" y="800">文字</text>
  <rect x="664" y="810" width="292" height="28" rx="7" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="674" y="829">长夜将明</text>
  <text class="tiny" x="946" y="829" text-anchor="end">书名</text>
  <rect x="664" y="844" width="292" height="28" rx="7" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="674" y="863">我在末世点亮第一盏灯</text>
  <text class="tiny" x="946" y="863" text-anchor="end">副标题</text>
  <rect x="664" y="878" width="292" height="28" rx="7" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="body" x="674" y="897">陆 · 著</text>
  <text class="tiny" x="946" y="897" text-anchor="end">作者（可空）</text>

  <text class="small" x="344" y="912">字体</text>
  <rect x="344" y="920" width="190" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="356" y="940">思源宋体（自定义）</text>
  <text class="body" x="522" y="940" text-anchor="end">▾</text>
  <rect x="542" y="920" width="90" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="554" y="940">粗体</text>
  <text class="body" x="620" y="940" text-anchor="end">▾</text>

  <text class="small" x="664" y="930">颜色</text>
  <rect x="700" y="918" width="22" height="22" rx="5" fill="#F5EBD7" stroke="#2C2C2A" stroke-width="1.5"/>
  <rect x="730" y="918" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#D3D1C7"/>
  <rect x="760" y="918" width="22" height="22" rx="5" fill="#2C2C2A"/>
  <rect x="790" y="918" width="22" height="22" rx="5" fill="#378ADD"/>
  <text class="tiny" x="822" y="934">方案色 · 白 · 黑 · 强调</text>

  <text class="small" x="344" y="980">字号</text>
  <line x1="384" y1="976" x2="632" y2="976" stroke="#D3D1C7" stroke-width="4" stroke-linecap="round"/>
  <line x1="384" y1="976" x2="520" y2="976" stroke="#2C2C2A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="520" cy="976" r="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.5"/>
  <rect x="664" y="966" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#888780"/>
  <text class="body" x="684" y="978">描边</text>
  <rect x="730" y="966" width="14" height="14" rx="3" fill="#2C2C2A"/>
  <text x="737" y="977" text-anchor="middle" font-size="11" fill="#FFFFFF">✓</text>
  <text class="body" x="750" y="978">阴影</text>

  <text class="tiny" x="344" y="1040">按原图分辨率合成 PNG；导出可选原尺寸、600×800、1080×1440</text>
  <rect x="704" y="1022" width="110" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="759" y="1043" text-anchor="middle">保存排版</text>
  <rect x="826" y="1022" width="130" height="32" rx="8" fill="#2C2C2A"/>
  <text class="btn-p" x="891" y="1043" text-anchor="middle">采用为封面</text>
</svg>
