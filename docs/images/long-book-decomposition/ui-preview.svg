  <text class="btn-p" x="893" y="118" text-anchor="middle">打开长篇</text>

  <rect x="250" y="166" width="690" height="40" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="summary" x="270" y="191">已写入《示例长篇》：1,024 章；连续性覆盖第 1,024 章；全书已批次提交</text>

