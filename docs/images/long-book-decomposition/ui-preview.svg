  </g>

  <rect x="516" y="222" width="424" height="554" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="et" x="536" y="256">境界</text>
  <text class="small" x="536" y="278">世界观 · 境界 · 9 个条目 · 可直接修改</text>
  <line x1="536" y1="292" x2="924" y2="292" stroke="#EFEDE6"/>
  <text class="md-h" x="536" y="322">## 境界划分</text>
  <text class="body" x="536" y="350">1. 炼气（一至九层）：引气入体，可施展低阶术法。</text>
  <text class="body" x="536" y="376">2. 筑基：凝练道基，寿元大增；首次出现于第 12 章。</text>
  <text class="body" x="536" y="402">3. 金丹：……</text>
  <text class="body" x="536" y="428">4. 元婴：……</text>
  <text class="md-h" x="536" y="462">## 关键设定</text>
  <text class="body" x="536" y="490">· 突破需借助灵药或机缘，失败会跌落境界（第 87 章）。</text>
  <text class="body" x="536" y="516">· 境界压制：高一大境界可压制对手术法（第 133 章）。</text>
  <g fill="#EFEDE6">
    <rect x="536" y="536" width="360" height="10" rx="5"/>
    <rect x="536" y="556" width="320" height="10" rx="5"/>
    <rect x="536" y="576" width="340" height="10" rx="5"/>
