  <text class="desc" x="250" y="146">《示例长篇》 · 续写模式 · 拆解完成，内容已保存</text>
  <rect x="744" y="98" width="94" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="791" y="118" text-anchor="middle">任务记录</text>
