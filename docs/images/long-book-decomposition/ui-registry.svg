    <rect x="580" y="353" width="104" height="26" rx="6"/>
    <rect x="580" y="393" width="104" height="26" rx="6"/>
    <rect x="580" y="433" width="104" height="26" rx="6"/>
    <rect x="580" y="473" width="104" height="26" rx="6"/>
    <rect x="580" y="513" width="104" height="26" rx="6"/>
