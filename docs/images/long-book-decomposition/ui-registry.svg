<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="680" viewBox="0 0 1000 680" role="img">
  <title>界面线框：名册确认</title>
  <desc>名册已经写入真实目标，归并后停下等待确认。人物与设定可修改等级、合并或拆分，修改直接保存真实记录，确认后继续整合。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .side { font-size: 13px; fill: #444441; }
      .side-h { font-size: 12px; fill: #888780; }
      .side-active { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
      .eyebrow { font-size: 12px; fill: #888780; }
      .h1 { font-size: 22px; font-weight: 600; }
      .desc { font-size: 13px; fill: #5F5E5A; }
      .body { font-size: 13px; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .placeholder { font-size: 12.5px; fill: #888780; }
