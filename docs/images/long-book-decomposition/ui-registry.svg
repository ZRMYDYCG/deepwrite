  <text class="small" x="580" y="294">等级</text>
  <text class="small" x="708" y="294">出现块数</text>
  <text class="small" x="780" y="294">首次出现</text>
  <text class="small" x="870" y="294">操作</text>
  <g stroke="#EFEDE6">
    <line x1="270" y1="306" x2="924" y2="306"/>
    <line x1="270" y1="346" x2="924" y2="346"/>
    <line x1="270" y1="386" x2="924" y2="386"/>
    <line x1="270" y1="426" x2="924" y2="426"/>
    <line x1="270" y1="466" x2="924" y2="466"/>
    <line x1="270" y1="506" x2="924" y2="506"/>
    <line x1="270" y1="546" x2="924" y2="546"/>
