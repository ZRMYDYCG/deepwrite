      .link { font-size: 12.5px; fill: #185FA5; }
      .btn { font-size: 13px; }
      .btn-p { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .tab-on { font-size: 13.5px; font-weight: 600; }
