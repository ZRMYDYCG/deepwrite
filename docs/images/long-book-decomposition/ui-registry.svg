  <text class="body" x="590" y="531">路人</text>
  <text class="muted" x="676" y="531" text-anchor="end">▾</text>
  <text class="muted" x="708" y="531">2</text>
  <text class="muted" x="780" y="531">第 12 章</text>
  <text class="link" x="870" y="531">拆分</text>

  <rect x="270" y="562" width="654" height="36" rx="8" fill="#F1EFE8"/>
  <text class="body" x="286" y="585">已选 2 个：苏晚晴、苏师姐</text>
  <rect x="790" y="567" width="124" height="26" rx="6" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="852" y="585" text-anchor="middle">合并为一个人物</text>
  <text class="small" x="270" y="622">等级决定建档方式：主角、主要配角单独建档；次要配角成组建档；路人只留在名册</text>
