  <rect width="1000" height="680" fill="#FFFFFF"/>
  <rect x="20" y="20" width="960" height="640" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <path d="M20 56 V32 Q20 20 32 20 H968 Q980 20 980 32 V56 Z" fill="#F7F6F2"/>
  <line x1="20" y1="56" x2="980" y2="56" stroke="#E5E3DA"/>
  <circle cx="42" cy="38" r="5" fill="#D3D1C7"/>
  <circle cx="60" cy="38" r="5" fill="#D3D1C7"/>
  <circle cx="78" cy="38" r="5" fill="#D3D1C7"/>
  <text class="small" x="500" y="42" text-anchor="middle">DeepWrite</text>

  <path d="M20 56 H210 V660 H32 Q20 660 20 648 Z" fill="#F7F6F2"/>
  <line x1="210" y1="56" x2="210" y2="660" stroke="#E5E3DA"/>
  <text class="side" x="40" y="92">创作空间</text>
  <text class="side" x="40" y="120">素材库</text>
