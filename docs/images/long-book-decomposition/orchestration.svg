<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="960" height="540" viewBox="0 0 960 540" role="img">
  <title>阶段内编排：以通读为例</title>
  <desc>主控并行派发最多五个通读员。通读员按章节或片段经受控提交桥直接写入真实书籍或素材与回执，保存成功后通知界面；覆盖校验只重新派发未完成部分。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .h1 { font-size: 20px; font-weight: 600; }
      .lead { font-size: 13px; fill: #5F5E5A; }
      .bt { font-size: 15px; font-weight: 600; }
      .bs { font-size: 12.5px; }
      .ct { font-size: 13px; fill: #3C3489; }
      .note { font-size: 12px; fill: #5F5E5A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text class="h1" x="40" y="44">阶段内编排 · 以通读为例</text>
  <text class="lead" x="40" y="68">按包派发、按章保存；Core 真实写入后返回回执，中断只继续未完成部分</text>

  <rect x="40" y="196" width="180" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="bt" x="130" y="225" text-anchor="middle">工作流控制器</text>
  <text class="bs" x="130" y="249" text-anchor="middle" fill="#5F5E5A">取下一包（≤20 块）</text>
  <line x1="220" y1="232" x2="267" y2="232" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="270" y="196" width="170" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="bt" x="355" y="225" text-anchor="middle" fill="#3C3489">阶段主控</text>
  <text class="bs" x="355" y="249" text-anchor="middle" fill="#534AB7">spawn_subagent</text>
  <text class="note" x="270" y="300">主控：交接摘要累积后</text>
  <text class="note" x="270" y="320">按 ContextPolicy 压缩</text>

  <g stroke="#73726C" stroke-width="1.2">
    <line x1="440" y1="232" x2="487" y2="116" marker-end="url(#arrow)"/>
    <line x1="440" y1="232" x2="487" y2="166" marker-end="url(#arrow)"/>
    <line x1="440" y1="232" x2="487" y2="216" marker-end="url(#arrow)"/>
    <line x1="440" y1="232" x2="487" y2="266" marker-end="url(#arrow)"/>
    <line x1="440" y1="232" x2="487" y2="316" marker-end="url(#arrow)"/>
    <line x1="440" y1="232" x2="487" y2="366" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>
  <g fill="#F6F5FE" stroke="#7F77DD" stroke-width="1">
    <rect x="490" y="96" width="210" height="40" rx="8"/>
    <rect x="490" y="146" width="210" height="40" rx="8"/>
    <rect x="490" y="196" width="210" height="40" rx="8"/>
    <rect x="490" y="246" width="210" height="40" rx="8"/>
    <rect x="490" y="296" width="210" height="40" rx="8"/>
  </g>
  <text class="ct" x="595" y="121" text-anchor="middle">通读员 · 块 41</text>
  <text class="ct" x="595" y="171" text-anchor="middle">通读员 · 块 42</text>
  <text class="ct" x="595" y="221" text-anchor="middle">通读员 · 块 43</text>
  <text class="ct" x="595" y="271" text-anchor="middle">通读员 · 块 44</text>
  <text class="ct" x="595" y="321" text-anchor="middle">通读员 · 块 45</text>
  <rect x="490" y="346" width="210" height="40" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="bs" x="595" y="371" text-anchor="middle" fill="#5F5E5A">排队：块 46–60（同时 ≤5）</text>
  <text class="note" x="490" y="416">子智能体只读本块原文，输入事先按预算切好</text>

  <g stroke="#73726C" stroke-width="1.2">
    <line x1="700" y1="116" x2="747" y2="198" marker-end="url(#arrow)"/>
    <line x1="700" y1="166" x2="747" y2="200" marker-end="url(#arrow)"/>
    <line x1="700" y1="216" x2="747" y2="203" marker-end="url(#arrow)"/>
    <line x1="700" y1="266" x2="747" y2="206" marker-end="url(#arrow)"/>
    <line x1="700" y1="316" x2="747" y2="208" marker-end="url(#arrow)"/>
  </g>

  <rect x="750" y="166" width="170" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="bt" x="835" y="195" text-anchor="middle">受控提交</text>
  <text class="bs" x="835" y="219" text-anchor="middle" fill="#5F5E5A">校验章节与固定目标</text>
  <line x1="835" y1="238" x2="835" y2="293" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="750" y="296" width="170" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="bt" x="835" y="325" text-anchor="middle" fill="#085041">Core 真实写入</text>
  <text class="bs" x="835" y="349" text-anchor="middle" fill="#0F6E56">书籍／素材＋回执</text>
  <text class="note" x="810" y="394" text-anchor="end">保存后通知界面</text>
  <line x1="835" y1="368" x2="835" y2="443" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="270" y="446" width="650" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="bs" x="595" y="479" text-anchor="middle" fill="#2C2C2A">覆盖校验：每块每章都有梗概？缺失或失败的单元回到队列；全部通过后进入下一阶段</text>
  <path d="M270 474 H130 V271" fill="none" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
