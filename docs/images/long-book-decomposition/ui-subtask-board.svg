  <text class="body" x="200" y="465">次要人物群像 · 10 人</text>
  <text class="muted" x="390" y="465">第 6 位 · 等待并行名额（5/5 已占用）</text>
  <text class="muted" x="700" y="465">—</text>
  <text class="muted" x="770" y="465">—</text>
  <text class="chev" x="902" y="466">›</text>

  <text class="body" x="64" y="499">审校员</text>
  <text class="body" x="200" y="499">第一卷审校</text>
  <text class="muted" x="390" y="499">等待「主线与核心梗」「境界体系」完成</text>
  <text class="muted" x="700" y="499">—</text>
  <text class="muted" x="770" y="499">—</text>
  <text class="chev" x="902" y="500">›</text>
  <text class="small" x="64" y="530">另 2 个排队子任务…</text>

  <text class="group" x="44" y="570">待分派 · 1</text>
  <line x1="44" y1="612" x2="916" y2="612" stroke="#EFEDE6"/>
  <circle cx="54" cy="596" r="4" fill="#D3D1C7"/>
  <text class="small" x="64" y="601">—</text>
  <text class="body" x="200" y="601">门派势力</text>
  <text class="muted" x="390" y="601">已入本工作包，主控尚未分派</text>

  <text class="group" x="44" y="646">已结束 · 2</text>
  <g stroke="#EFEDE6">
    <line x1="44" y1="688" x2="916" y2="688"/>
    <line x1="44" y1="722" x2="916" y2="722"/>
  </g>
  <text x="54" y="676" text-anchor="middle" font-size="12px" fill="#1D9E75">✓</text>
  <text class="body" x="64" y="676">分卷编年员</text>
  <text class="body" x="200" y="676">第一卷编年</text>
