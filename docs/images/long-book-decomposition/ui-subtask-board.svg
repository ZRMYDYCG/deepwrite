<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="960" height="800" viewBox="0 0 960 800" role="img">
  <title>界面线框：子任务看板</title>
  <desc>进度卡片下方的子任务看板：顶部是阶段主控状态，筛选分为全部、运行中、排队、待分派、已结束；每行显示成员、负责单元、当前动作或排队原因、用时、工具次数与用量，点击行打开执行详情。底部可展开上一个工作包。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .ct { font-size: 15px; font-weight: 600; }
      .body { font-size: 13px; }
      .strong { font-size: 13px; font-weight: 600; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .small { font-size: 12px; fill: #888780; }
      .group { font-size: 12px; font-weight: 600; fill: #5F5E5A; }
      .seg { font-size: 12.5px; fill: #444441; }
      .seg-on { font-size: 12.5px; font-weight: 600; fill: #2C2C2A; }
      .pill { font-size: 11.5px; }
      .accent { font-size: 12.5px; fill: #534AB7; }
      .warn { font-size: 12.5px; fill: #854F0B; }
      .danger { font-size: 12.5px; fill: #A32D2D; }
      .chev { font-size: 16px; fill: #B4B2A9; }
      .note { font-size: 11.5px; fill: #534AB7; }
    </style>
  </defs>
  <rect width="960" height="800" fill="#FFFFFF"/>
  <rect x="20" y="20" width="920" height="760" rx="12" fill="#FFFFFF" stroke="#E5E3DA"/>

  <text class="ct" x="44" y="56">子任务</text>
  <text class="muted" x="916" y="56" text-anchor="end">第 37 个工作包 · 整合阶段 · 12 个单元</text>

  <rect x="44" y="72" width="872" height="44" rx="8" fill="#F7F6F2"/>
  <circle cx="62" cy="94" r="5" fill="#534AB7"/>
  <text class="strong" x="76" y="99">阶段主控</text>
  <rect x="142" y="84" width="54" height="20" rx="10" fill="#EEEDFE"/>
  <text class="pill" x="169" y="98" text-anchor="middle" fill="#3C3489">分派中</text>
  <text class="muted" x="208" y="99">调用 spawn_subagent · 已排定 11 个子任务</text>
  <text class="muted" x="900" y="99" text-anchor="end">02:14</text>

  <rect x="44" y="132" width="452" height="32" rx="10" fill="#F7F6F2" stroke="#EFEDE6"/>
  <rect x="47" y="135" width="78" height="26" rx="8" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="seg-on" x="86" y="153" text-anchor="middle">全部 12</text>
  <text class="seg" x="172" y="153" text-anchor="middle">运行中 5</text>
  <text class="seg" x="258" y="153" text-anchor="middle">排队 4</text>
  <text class="seg" x="344" y="153" text-anchor="middle">待分派 1</text>
  <text class="seg" x="440" y="153" text-anchor="middle">已结束 2</text>
  <text class="note" x="916" y="153" text-anchor="end">运行中、排队默认在前；已结束按完成时间倒序</text>

  <text class="small" x="64" y="194">成员</text>
  <text class="small" x="200" y="194">负责单元</text>
  <text class="small" x="390" y="194">当前动作 / 排队原因</text>
  <text class="small" x="700" y="194">用时</text>
