  <text class="accent" x="390" y="255">调用 write_character_dossier</text>
  <text class="muted" x="700" y="255">1:12</text>
  <text class="muted" x="770" y="255">3 次</text>
  <text class="chev" x="902" y="256">›</text>

  <text class="body" x="64" y="289">人物档案师</text>
  <text class="body" x="200" y="289">岳不群 · 主要人物</text>
  <text class="muted" x="390" y="289">思考中</text>
  <text class="muted" x="700" y="289">0:51</text>
  <text class="muted" x="770" y="289">1 次</text>
  <text class="chev" x="902" y="290">›</text>

  <text class="body" x="64" y="323">设定整理师</text>
  <text class="body" x="200" y="323">境界体系</text>
  <text class="muted" x="390" y="323">输出交接摘要</text>
  <text class="muted" x="700" y="323">2:03</text>
  <text class="muted" x="770" y="323">5 次</text>
  <text class="chev" x="902" y="324">›</text>

  <text class="body" x="64" y="357">剧情架构师</text>
  <text class="body" x="200" y="357">主线与核心梗</text>
  <text class="warn" x="390" y="357">模型重试 1/3 · 8 秒后</text>
