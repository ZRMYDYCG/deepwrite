  <line x1="44" y1="204" x2="916" y2="204" stroke="#E5E3DA"/>

  <text class="group" x="44" y="226">运行中 · 5</text>
  <g stroke="#EFEDE6">
    <line x1="44" y1="266" x2="916" y2="266"/>
    <line x1="44" y1="300" x2="916" y2="300"/>
    <line x1="44" y1="334" x2="916" y2="334"/>
    <line x1="44" y1="368" x2="916" y2="368"/>
    <line x1="44" y1="402" x2="916" y2="402"/>
  </g>
  <rect x="44" y="234" width="872" height="32" fill="#F4F3EE"/>
  <g fill="#534AB7">
    <circle cx="54" cy="250" r="4"/>
    <circle cx="54" cy="284" r="4"/>
    <circle cx="54" cy="318" r="4"/>
    <circle cx="54" cy="352" r="4"/>
    <circle cx="54" cy="386" r="4"/>
