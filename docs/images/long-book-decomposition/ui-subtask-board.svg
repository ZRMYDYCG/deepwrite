  <text class="muted" x="700" y="676">2:05</text>
  <text class="muted" x="770" y="676">4 次 · 6.1 万</text>
  <text class="chev" x="902" y="677">›</text>

  <text x="54" y="710" text-anchor="middle" font-size="12px" fill="#A32D2D">✕</text>
  <text class="body" x="64" y="710">设定整理师</text>
  <text class="body" x="200" y="710">地理</text>
  <text class="danger" x="390" y="710">失败 · 提交校验未通过（本包还可重派 1 次）</text>
  <text class="muted" x="700" y="710">0:47</text>
  <text class="muted" x="770" y="710">2 次 · 2.3 万</text>
  <text class="chev" x="902" y="711">›</text>

  <text class="muted" x="44" y="756">› 上一个工作包：第 36 个 · 12 个子任务 · 全部完成 · 18:42</text>
</svg>
