<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="960" height="890" viewBox="0 0 960 890" role="img">
  <title>长篇整书拆解工作流总览</title>
  <desc>六个阶段：准备真实目标与切分、通读、名册归并、整合、审校与修复、完成检查。运行中每个单元直接写入真实长篇或素材库，轻量状态与目标回执支持恢复，结束时不搬运结果。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .h1 { font-size: 20px; font-weight: 600; }
      .lead { font-size: 13px; fill: #5F5E5A; }
      .st { font-size: 15px; font-weight: 600; }
      .ss { font-size: 12.5px; }
      .agent-t { fill: #3C3489; } .agent-s { fill: #534AB7; }
      .det-t { fill: #2C2C2A; } .det-s { fill: #5F5E5A; }
      .art-t { font-size: 13.5px; font-weight: 600; fill: #444441; }
      .art-s { font-size: 12px; fill: #5F5E5A; }
      .out-t { font-size: 15px; font-weight: 600; fill: #085041; }
      .out-s { font-size: 13px; fill: #0F6E56; }
      .legend { font-size: 12.5px; fill: #5F5E5A; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="890" fill="#FFFFFF"/>
  <text class="h1" x="40" y="44">长篇整书拆解 · 工作流总览</text>
  <text class="lead" x="40" y="68">目标先创建，单元完成即写入真实内容；状态与回执支持断点续跑</text>

  <rect x="60" y="96" width="360" height="64" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="st det-t" x="240" y="122" text-anchor="middle">① 准备目标与切分</text>
  <text class="ss det-s" x="240" y="144" text-anchor="middle">先选定或新建书籍／素材分组，再调用模型</text>
  <line x1="240" y1="160" x2="240" y2="193" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="60" y="196" width="360" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="st agent-t" x="240" y="222" text-anchor="middle">② 通读</text>
  <text class="ss agent-s" x="240" y="244" text-anchor="middle">主控按包派通读员 · 每包 ≤20 块 · 同时 ≤5 个</text>
  <line x1="240" y1="260" x2="240" y2="293" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="60" y="296" width="360" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="st agent-t" x="240" y="322" text-anchor="middle">③ 名册归并</text>
  <text class="ss agent-s" x="240" y="344" text-anchor="middle">人物与设定去重、分级、归类 · 停下等用户确认</text>
  <line x1="240" y1="360" x2="240" y2="393" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="60" y="396" width="360" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="st agent-t" x="240" y="422" text-anchor="middle">④ 整合</text>
  <text class="ss agent-s" x="240" y="444" text-anchor="middle">主控自由编排：编年·人物·设定·伏笔·文风·连续性</text>
  <line x1="240" y1="460" x2="240" y2="493" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="60" y="496" width="360" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="st agent-t" x="240" y="522" text-anchor="middle">⑤ 审校与修复</text>
  <text class="ss agent-s" x="240" y="544" text-anchor="middle">审校员查矛盾与遗漏 → 主控派修复（一期一轮）</text>
  <line x1="240" y1="560" x2="240" y2="593" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="60" y="596" width="360" height="64" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text class="st det-t" x="240" y="622" text-anchor="middle">⑥ 完成检查</text>
  <text class="ss det-s" x="240" y="644" text-anchor="middle">核对真实内容与回执，完成索引和连续性账本</text>

  <g stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="420" y1="128" x2="520" y2="128"/>
    <line x1="420" y1="228" x2="520" y2="228"/>
    <line x1="420" y1="328" x2="520" y2="328"/>
    <line x1="420" y1="428" x2="520" y2="428"/>
    <line x1="420" y1="528" x2="520" y2="528"/>
    <line x1="420" y1="628" x2="520" y2="628"/>
  </g>
  <g fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4">
    <rect x="520" y="96" width="400" height="64" rx="10"/>
    <rect x="520" y="196" width="400" height="64" rx="10"/>
    <rect x="520" y="296" width="400" height="64" rx="10"/>
    <rect x="520" y="396" width="400" height="64" rx="10"/>
    <rect x="520" y="496" width="400" height="64" rx="10"/>
    <rect x="520" y="596" width="400" height="64" rx="10"/>
  </g>
  <text class="art-t" x="540" y="122">真实目标＋job.json（仅状态）</text>
  <text class="art-s" x="540" y="144">目标绑定、来源引用、切分计划与进度</text>
  <text class="art-t" x="540" y="222">真实章卡／正式通读记录</text>
  <text class="art-s" x="540" y="244">按章或片段保存；中断只继续未完成部分</text>
  <text class="art-t" x="540" y="322">目标中的人物与设定名册</text>
  <text class="art-s" x="540" y="344">直接保存分片、归并与用户修改</text>
  <text class="art-t" x="540" y="422">真实人物、设定、剧情与素材</text>
  <text class="art-s" x="540" y="444">每个成品保存后即时可见，不等待最终导入</text>
  <text class="art-t" x="540" y="522">正式审校记录与直接修复</text>
  <text class="art-s" x="540" y="544">更新原对象；校验版本，保留用户修改</text>
  <text class="art-t" x="540" y="622">completion.json（仅状态）</text>
  <text class="art-s" x="540" y="644">内容已保存，校验覆盖并完成索引／账本</text>

  <path d="M240 660 V707" fill="none" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M240 684 H720 V707" fill="none" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="710" width="400" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="out-t" x="60" y="738">续写模式 · 已绑定的真实长篇</text>
  <text class="out-s" x="60" y="764">世界观 · 人物 · 剧情（含结构化伏笔线）· 正文（原文）</text>
  <text class="out-s" x="60" y="788">最新一章写连续性文件，全书作为一个批次提交</text>
  <text class="out-s" x="60" y="812">伏笔触点随批次判定，伏笔线状态自动推导</text>

  <rect x="520" y="710" width="400" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="out-t" x="540" y="738">素材模式 · 已绑定的真实素材分组</text>
  <text class="out-s" x="540" y="764">人设库 · 剧情库 · 正文库（文风）· 其他库（世界观）· 梗库</text>
  <text class="out-s" x="540" y="788">五个库的类型都是“长篇”，条目带名称与说明头部</text>
  <text class="out-s" x="540" y="812">同任务续跑更新原条目；其他已有素材保留</text>

  <rect x="40" y="854" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
  <text class="legend" x="62" y="866">智能体阶段：主控＋并行子智能体</text>
  <rect x="290" y="854" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780"/>
  <text class="legend" x="312" y="866">确定性步骤或用户操作</text>
  <rect x="490" y="854" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-dasharray="3 2"/>
  <text class="legend" x="512" y="866">真实内容与状态</text>
  <rect x="680" y="854" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="legend" x="702" y="866">落盘产出</text>
</svg>
