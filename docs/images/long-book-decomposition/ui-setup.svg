<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="1000" viewBox="0 0 1000 1000" role="img">
  <title>界面线框：开始前设置</title>
  <desc>长篇整书拆解在完成书籍导入和章节/范围确认后的设置：已确认来源、模式、真实目标选择或即时新建、方案与模型、预估。来源确认和目标绑定均成功后才调用模型，运行中直接保存到书籍或素材库。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .side { font-size: 13px; fill: #444441; }
      .side-h { font-size: 12px; fill: #888780; }
      .side-active { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
      .placeholder { font-size: 12.5px; fill: #888780; }
      .tiny { font-size: 11.5px; fill: #5F5E5A; }
      .body-lg { font-size: 14px; }
      .step-active { font-size: 12px; font-weight: 600; fill: #2C2C2A; }
      .eyebrow { font-size: 12px; fill: #888780; }
      .h1 { font-size: 22px; font-weight: 600; }
      .desc { font-size: 13px; fill: #5F5E5A; }
      .ct { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .small { font-size: 12px; fill: #5F5E5A; }
      .link { font-size: 12.5px; fill: #185FA5; }
      .btn { font-size: 13px; }
      .btn-p { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .metric { font-size: 18px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <rect x="20" y="20" width="960" height="960" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <path d="M20 56 V32 Q20 20 32 20 H968 Q980 20 980 32 V56 Z" fill="#F7F6F2"/>
  <line x1="20" y1="56" x2="980" y2="56" stroke="#E5E3DA"/>
  <circle cx="42" cy="38" r="5" fill="#D3D1C7"/>
  <circle cx="60" cy="38" r="5" fill="#D3D1C7"/>
  <circle cx="78" cy="38" r="5" fill="#D3D1C7"/>
  <text class="small" x="500" y="42" text-anchor="middle">DeepWrite</text>

  <path d="M20 56 H210 V980 H32 Q20 980 20 968 Z" fill="#F7F6F2"/>
  <line x1="210" y1="56" x2="210" y2="980" stroke="#E5E3DA"/>
  <text class="side" x="40" y="92">创作空间</text>
  <text class="side" x="40" y="120">素材库</text>
  <text class="side" x="40" y="148">技能库</text>
  <text class="side" x="40" y="176">设置</text>
  <line x1="36" y1="196" x2="194" y2="196" stroke="#E5E3DA"/>
  <text class="side-h" x="40" y="222">更多功能</text>
  <text class="side" x="40" y="250">聊天</text>
  <text class="side" x="40" y="278">短篇拆书分析</text>
  <text class="side" x="40" y="306">长篇拆书分析</text>
  <rect x="30" y="316" width="170" height="28" rx="6" fill="#EAE8E1"/>
  <text class="side-active" x="40" y="335">长篇整书拆解</text>
  <text class="side" x="40" y="362">修改分析</text>
  <text class="side" x="40" y="390">文风比对</text>
  <text class="side" x="40" y="418">……</text>

  <text class="eyebrow" x="250" y="92">更多功能</text>
  <text class="h1" x="250" y="122">长篇整书拆解</text>
  <text class="desc" x="250" y="146">先导入并确认章节，再准备目标；开始后逐步写入真实书籍或素材库</text>
  <rect x="598" y="98" width="88" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="642" y="118" text-anchor="middle">导入 TXT</text>
  <rect x="694" y="98" width="100" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="744" y="118" text-anchor="middle">导入文件夹</text>
  <rect x="846" y="98" width="94" height="30" rx="8" fill="#2C2C2A"/>
  <text class="btn-p" x="893" y="118" text-anchor="middle">开始拆解</text>

  <rect x="250" y="166" width="690" height="148" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="192">来源（已完成导入与校对）</text>
  <rect x="740" y="176" width="184" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="752" y="196">已导入的书</text>
  <text class="body" x="912" y="196" text-anchor="end">▾</text>
  <text class="body-lg" x="270" y="226">《示例长篇》</text>
  <text class="muted" x="380" y="226">1,024 章 · 312 万字 · 3 卷 · 识别提示 0 条</text>
  <text class="muted" x="270" y="250">拆解范围：第 1 章 – 第 1024 章</text>
  <text class="link" x="520" y="250">修改范围</text>
  <text class="muted" x="270" y="282">章节与范围已保存并确认 · 1,024 章参与拆解</text>
  <rect x="784" y="269" width="140" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="854" y="289" text-anchor="middle">返回章节校对</text>
  <text class="small" x="270" y="304">修改章节或范围后，请重新确认</text>

  <g transform="translate(0 60)">
  <rect x="250" y="278" width="690" height="102" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="304">拆解模式</text>
  <rect x="270" y="316" width="326" height="50" rx="8" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.6"/>
  <circle cx="290" cy="341" r="6" fill="#2C2C2A"/>
  <text class="body" x="306" y="336" font-weight="600">续写模式</text>
  <text class="tiny" x="306" y="356">写入长篇：世界观、人物、剧情、正文</text>
  <rect x="610" y="316" width="314" height="50" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <circle cx="630" cy="341" r="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.4"/>
  <text class="body" x="646" y="336" font-weight="600">素材模式</text>
  <text class="tiny" x="646" y="356">写入素材分组：人设、剧情、正文、其他、梗</text>

  <rect x="250" y="396" width="690" height="108" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="424">目标长篇</text>
  <rect x="270" y="438" width="430" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="282" y="458">《示例长篇》（已创建并绑定）</text>
  <text class="body" x="688" y="458" text-anchor="end">▾</text>
  <rect x="712" y="438" width="98" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="761" y="458" text-anchor="middle">即时新建</text>
  <rect x="820" y="438" width="104" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="872" y="458" text-anchor="middle">自动创建</text>
  <text class="small" x="270" y="492">章节已确认、目标准备成功后才能开跑；已写内容实时保存，停止后可继续</text>

  <g transform="translate(0 124)">
  <rect x="250" y="396" width="690" height="124" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="422">拆解方案</text>
  <text class="link" x="924" y="422" text-anchor="end">管理方案</text>
  <rect x="270" y="436" width="210" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="282" y="456">通用（内置）</text>
  <text class="body" x="468" y="456" text-anchor="end">▾</text>
  <text class="muted" x="500" y="456">世界观类别</text>
  <g fill="#F1EFE8" stroke="#D3D1C7">
    <rect x="572" y="440" width="40" height="22" rx="11"/>
    <rect x="616" y="440" width="40" height="22" rx="11"/>
    <rect x="660" y="440" width="40" height="22" rx="11"/>
    <rect x="704" y="440" width="40" height="22" rx="11"/>
    <rect x="748" y="440" width="40" height="22" rx="11"/>
    <rect x="792" y="440" width="40" height="22" rx="11"/>
    <rect x="836" y="440" width="40" height="22" rx="11"/>
  </g>
  <rect x="880" y="440" width="50" height="22" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-dasharray="3 2"/>
  <g class="small" text-anchor="middle">
    <text x="592" y="456" fill="#444441">规则</text>
    <text x="636" y="456" fill="#444441">势力</text>
    <text x="680" y="456" fill="#444441">地理</text>
    <text x="724" y="456" fill="#444441">历史</text>
    <text x="768" y="456" fill="#444441">术语</text>
    <text x="812" y="456" fill="#444441">境界</text>
    <text x="856" y="456" fill="#444441">物品</text>
    <text x="905" y="456" fill="#444441">+ 编辑</text>
  </g>
  <rect x="270" y="478" width="654" height="30" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="placeholder" x="282" y="498">侧重说明（可选）：例如重点梳理功法体系与宗门势力</text>

  <rect x="250" y="536" width="690" height="104" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="562">模型</text>
  <text class="muted" x="270" y="594">通读</text>
  <rect x="304" y="574" width="200" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="316" y="594">示例模型 A（大窗口）</text>
  <text class="body" x="492" y="594" text-anchor="end">▾</text>
  <text class="muted" x="520" y="594">思考</text>
  <rect x="554" y="574" width="90" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="566" y="594">关闭</text>
  <text class="body" x="632" y="594" text-anchor="end">▾</text>
  <text class="muted" x="664" y="594">整合</text>
  <rect x="698" y="574" width="150" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="710" y="594">示例模型 B</text>
  <text class="body" x="836" y="594" text-anchor="end">▾</text>
  <rect x="856" y="574" width="68" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="868" y="594">中</text>
  <text class="body" x="912" y="594" text-anchor="end">▾</text>
  <text class="small" x="270" y="628">子智能体同时最多 5 个；更多功能共 3 个运行名额，本任务占 1 个</text>

  <rect x="250" y="656" width="690" height="120" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="682">开跑前预估</text>
  <text class="metric" x="270" y="718">112</text>
  <text class="small" x="270" y="740">阅读块</text>
  <text class="metric" x="440" y="718">约 190 次</text>
  <text class="small" x="440" y="740">模型调用（含子智能体）</text>
  <text class="metric" x="610" y="718">320–480 万</text>
  <text class="small" x="610" y="740">输入 token</text>
  <text class="metric" x="780" y="718">1–2 小时</text>
  <text class="small" x="780" y="740">预计耗时</text>
  <text class="small" x="270" y="766">按所选模型计价；可以先拆一段章节看效果</text>
  </g>
  </g>
</svg>
