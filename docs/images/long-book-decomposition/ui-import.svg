<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="1000" height="900" viewBox="0 0 1000 900" role="img">
  <title>界面线框：导入书籍与章节校对</title>
  <desc>拆书前先导入 TXT、按章整理的文件夹或选择已导入书籍，自动识别章节并展示目录和正文。用户可以改名、排序、拆分、合并，校对结果持久化保存；确认章节与范围后才进入目标准备与拆解设置。未确认时开始拆解禁用。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .side { font-size: 13px; fill: #444441; }
      .side-h { font-size: 12px; fill: #888780; }
      .side-active { font-size: 13px; font-weight: 600; }
      .eyebrow { font-size: 12px; fill: #888780; }
      .h1 { font-size: 22px; font-weight: 600; }
      .desc { font-size: 13px; fill: #5F5E5A; }
      .ct { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .small { font-size: 12px; fill: #5F5E5A; }
      .link { font-size: 12.5px; fill: #185FA5; }
      .btn { font-size: 13px; }
      .btn-p { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
    </style>
  </defs>
  <rect width="1000" height="900" fill="#FFFFFF"/>
  <rect x="20" y="20" width="960" height="860" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
  <path d="M20 56 V32 Q20 20 32 20 H968 Q980 20 980 32 V56 Z" fill="#F7F6F2"/>
  <line x1="20" y1="56" x2="980" y2="56" stroke="#E5E3DA"/>
  <circle cx="42" cy="38" r="5" fill="#D3D1C7"/>
  <circle cx="60" cy="38" r="5" fill="#D3D1C7"/>
  <circle cx="78" cy="38" r="5" fill="#D3D1C7"/>
  <text class="small" x="500" y="42" text-anchor="middle">DeepWrite</text>

  <path d="M20 56 H210 V880 H32 Q20 880 20 868 Z" fill="#F7F6F2"/>
  <line x1="210" y1="56" x2="210" y2="880" stroke="#E5E3DA"/>
  <text class="side" x="40" y="92">创作空间</text>
  <text class="side" x="40" y="120">素材库</text>
  <text class="side" x="40" y="148">技能库</text>
  <text class="side" x="40" y="176">设置</text>
  <line x1="36" y1="196" x2="194" y2="196" stroke="#E5E3DA"/>
  <text class="side-h" x="40" y="222">更多功能</text>
  <text class="side" x="40" y="250">聊天</text>
  <text class="side" x="40" y="278">短篇拆书分析</text>
  <text class="side" x="40" y="306">长篇拆书分析</text>
  <rect x="30" y="316" width="170" height="28" rx="6" fill="#EAE8E1"/>
  <text class="side-active" x="40" y="335">长篇整书拆解</text>
  <text class="side" x="40" y="362">修改分析</text>
  <text class="side" x="40" y="390">文风比对</text>
  <text class="side" x="40" y="418">……</text>

  <text class="eyebrow" x="250" y="92">长篇整书拆解 · 前置工作</text>
  <text class="h1" x="250" y="122">导入与章节校对</text>
  <text class="desc" x="250" y="146">先导入书籍并确认章节目录，再准备真实目标和开始拆书</text>
  <rect x="598" y="98" width="88" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="642" y="118" text-anchor="middle">导入 TXT</text>
  <rect x="694" y="98" width="100" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="744" y="118" text-anchor="middle">导入文件夹</text>
  <rect x="846" y="98" width="94" height="30" rx="8" fill="#E5E3DA"/>
  <text class="btn" x="893" y="118" text-anchor="middle" fill="#888780">开始拆解</text>

  <rect x="250" y="166" width="690" height="42" rx="10" fill="#F7F6F2" stroke="#E5E3DA"/>
  <text class="muted" x="270" y="192">① 导入书籍</text>
  <text class="muted" x="374" y="192">→</text>
  <text class="body" x="410" y="192" font-weight="600">② 章节校对</text>
  <text class="muted" x="514" y="192">→</text>
  <text class="muted" x="550" y="192">③ 目标准备</text>
  <text class="muted" x="654" y="192">→</text>
  <text class="muted" x="690" y="192">④ 开始拆解</text>

  <rect x="250" y="224" width="690" height="88" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="253">《示例长篇》</text>
  <rect x="740" y="234" width="184" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="752" y="254">已导入的书</text>
  <text class="body" x="912" y="254" text-anchor="end">▾</text>
  <text class="muted" x="270" y="286">1,024 章 · 312 万字 · 3 卷 · 识别提示 0 条</text>
  <text class="muted" x="660" y="286">校对已保存 · 待确认</text>

  <rect x="250" y="328" width="270" height="316" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="355">章节目录</text>
  <text class="small" x="270" y="383">可改名、拖动或上下调整顺序</text>
  <line x1="266" y1="396" x2="504" y2="396" stroke="#E5E3DA"/>
  <rect x="262" y="480" width="246" height="36" rx="6" fill="#EAE8E1"/>
  <g class="body">
    <text x="270" y="423">1</text>
    <text x="298" y="423">第 1 章 入山</text>
    <text x="270" y="465">2</text>
    <text x="298" y="465">第 2 章 来信</text>
    <text x="270" y="503">3</text>
    <text x="298" y="503" font-weight="600">第 3 章 夜行</text>
    <text x="270" y="547">4</text>
    <text x="298" y="547">第 4 章 访客</text>
    <text x="270" y="589">5</text>
    <text x="298" y="589">第 5 章 旧路</text>
  </g>
  <g class="small" text-anchor="end">
    <text x="498" y="423">3,080 字</text>
    <text x="498" y="465">2,964 字</text>
    <text x="498" y="503">3,124 字</text>
    <text x="498" y="547">3,006 字</text>
    <text x="498" y="589">2,890 字</text>
  </g>
  <line x1="266" y1="608" x2="504" y2="608" stroke="#E5E3DA"/>
  <text class="small" x="270" y="629">1–100 / 1,024 章</text>
  <text class="link" x="498" y="629" text-anchor="end">下一页 →</text>

  <rect x="536" y="328" width="404" height="316" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="554" y="355">正文预览 · 第 3 章 夜行</text>
  <text class="small" x="554" y="379">第一卷 · 在正文中定位拆分位置</text>
  <rect x="554" y="394" width="368" height="166" rx="6" fill="#F7F6F2" stroke="#D3D1C7"/>
  <g class="body" fill="#444441">
    <text x="566" y="419">山门闭合时，石阶下传来脚步声。</text>
    <text x="566" y="443">来人递出一封信，说天亮前必须送到。</text>
    <text x="566" y="479">守夜的弟子提起灯，走向山道。</text>
    <text x="566" y="503">信封背面只有一道模糊的印记。</text>
    <text x="566" y="539">……</text>
  </g>
  <line x1="566" y1="461" x2="566" y2="481" stroke="#2C2C2A" stroke-width="1.5"/>
  <rect x="554" y="580" width="114" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="611" y="600" text-anchor="middle">按光标拆分</text>
  <rect x="676" y="580" width="114" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="733" y="600" text-anchor="middle">与前章合并</text>
  <rect x="798" y="580" width="124" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="860" y="600" text-anchor="middle">与后章合并</text>
  <text class="small" x="554" y="632">操作后保存校对结果，可再次打开继续编辑</text>

  <rect x="250" y="660" width="690" height="126" rx="10" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="ct" x="270" y="687">确认拆解范围</text>
  <text class="body" x="270" y="724">第</text>
  <rect x="294" y="703" width="96" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="306" y="723">1</text>
  <text class="body" x="402" y="724">章 — 第</text>
  <rect x="462" y="703" width="96" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="body" x="474" y="723">1024</text>
  <text class="body" x="570" y="724">章</text>
  <rect x="628" y="703" width="90" height="30" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="673" y="723" text-anchor="middle">选择整本</text>
  <text class="small" x="270" y="766">本次：1,024 章 · 312 万字 · 3 卷；确认后进入目标准备与拆解设置</text>

  <text class="muted" x="250" y="826">章节校对已保存，请确认本次输入</text>
  <rect x="744" y="804" width="196" height="34" rx="8" fill="#2C2C2A"/>
  <text class="btn-p" x="842" y="826" text-anchor="middle">确认章节与范围</text>
  <text class="small" x="250" y="862">未确认前不会调用模型；再次进入可从已导入书籍继续校对</text>
</svg>
