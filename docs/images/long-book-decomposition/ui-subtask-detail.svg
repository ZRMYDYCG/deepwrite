<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="960" height="760" viewBox="0 0 960 760" role="img">
  <title>界面线框：子任务执行详情</title>
  <desc>点击看板中的一行打开详情弹窗：标题为成员与负责单元，右上角是实时状态与用时；依次显示负责单元、主控分派说明、执行过程（思考、工具调用与结果摘要、回复）、交接摘要或错误；底部是工具次数与用量。运行中时内容实时更新。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .eyebrow { font-size: 12px; fill: #888780; }
      .h1 { font-size: 18px; font-weight: 600; }
      .ct { font-size: 13px; font-weight: 600; }
      .body { font-size: 13px; }
      .muted { font-size: 12.5px; fill: #5F5E5A; }
      .small { font-size: 12px; fill: #888780; }
      .pill { font-size: 11.5px; }
      .chip { font-size: 12px; fill: #444441; }
      .mono { font-size: 12px; font-family: "SF Mono", Menlo, Consolas, monospace; fill: #444441; }
      .accent { font-size: 12.5px; fill: #534AB7; }
      .btn { font-size: 13px; }
      .btn-off { font-size: 13px; fill: #B4B2A9; }
    </style>
  </defs>
  <rect width="960" height="760" fill="#FFFFFF"/>
  <rect width="960" height="760" fill="#2C2C2A" opacity="0.16"/>

  <rect x="150" y="30" width="660" height="700" rx="14" fill="#FFFFFF" stroke="#D3D1C7"/>
  <text class="eyebrow" x="178" y="66">子任务详情 · 第 37 个工作包</text>
  <text class="h1" x="178" y="94">人物档案师 · 林平之</text>
  <rect x="660" y="76" width="92" height="22" rx="11" fill="#EEEDFE"/>
  <text class="pill" x="706" y="91" text-anchor="middle" fill="#3C3489">运行中 · 1:12</text>
  <text x="780" y="92" font-size="18px" fill="#888780" text-anchor="middle">×</text>
  <text class="muted" x="178" y="120">任务键 char-lin · 整合模型 · 子运行 subrun_…7f2a</text>

  <text class="ct" x="178" y="156">负责单元</text>
  <rect x="178" y="166" width="236" height="28" rx="7" fill="#F7F6F2" stroke="#EFEDE6"/>
  <text class="mono" x="190" y="185">character:linpingzhi</text>
  <text class="chip" x="352" y="185">林平之</text>
  <rect x="676" y="164" width="106" height="30" rx="8" fill="#FFFFFF" stroke="#E5E3DA"/>
  <text class="btn-off" x="729" y="184" text-anchor="middle">打开记录</text>
  <text class="small" x="672" y="184" text-anchor="end">单元完成后可用</text>

  <text class="ct" x="178" y="226">主控分派说明</text>
  <rect x="178" y="236" width="604" height="58" rx="8" fill="#F7F6F2"/>
  <text class="muted" x="192" y="260">character:linpingzhi 使用 character_archivist。侧重人物弧光、</text>
  <text class="muted" x="192" y="282">师门关系变化与最新状态；分卷小传以已保存为准。</text>

  <text class="ct" x="178" y="326">执行过程</text>
  <g stroke="#EFEDE6">
    <line x1="178" y1="370" x2="782" y2="370"/>
    <line x1="178" y1="404" x2="782" y2="404"/>
    <line x1="178" y1="438" x2="782" y2="438"/>
    <line x1="178" y1="472" x2="782" y2="472"/>
  </g>
  <rect x="178" y="340" width="40" height="20" rx="6" fill="#F1EFE8"/>
  <text class="pill" x="198" y="354" text-anchor="middle" fill="#5F5E5A">思考</text>
  <text class="muted" x="230" y="355">比对 3 份已保存的分卷小传，最新状态以第 412 章为准……</text>
  <text class="small" x="782" y="355" text-anchor="end">展开</text>

  <text x="190" y="392" font-size="12px" fill="#1D9E75" text-anchor="middle">✓</text>
  <text class="mono" x="206" y="392">read_character_mentions</text>
  <text class="muted" x="400" y="392">返回 18 处提及（第 1–412 章）</text>
  <text class="small" x="782" y="392" text-anchor="end">参数 · 结果</text>

  <text x="190" y="426" font-size="12px" fill="#1D9E75" text-anchor="middle">✓</text>
  <text class="mono" x="206" y="426">write_character_dossier</text>
  <text class="muted" x="400" y="426">已保存 1 项（核心档案）</text>
  <text class="small" x="782" y="426" text-anchor="end">参数 · 结果</text>

  <circle cx="190" cy="456" r="4" fill="#534AB7"/>
  <text class="mono" x="206" y="460">write_character_biography</text>
  <text class="accent" x="400" y="460">运行中…</text>

  <rect x="178" y="482" width="40" height="20" rx="6" fill="#F1EFE8"/>
  <text class="pill" x="198" y="496" text-anchor="middle" fill="#5F5E5A">回复</text>
  <text class="muted" x="230" y="497">正在整理交接：核心档案已保存，分卷小传提交中……</text>

  <text class="ct" x="178" y="546">交接摘要</text>
  <rect x="178" y="556" width="604" height="56" rx="8" fill="#FFFFFF" stroke="#EFEDE6" stroke-dasharray="4 4"/>
  <text class="small" x="192" y="580">子任务结束后显示交接摘要；失败或被跳过时显示原因。</text>
  <text class="small" x="192" y="600">内容来自 subagent.completed 的 summary / errorMessage。</text>

  <line x1="150" y1="648" x2="810" y2="648" stroke="#EFEDE6"/>
  <text class="muted" x="178" y="684">工具调用 3 次 · 用量在子任务结束后汇总</text>
  <rect x="690" y="664" width="92" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text class="btn" x="736" y="685" text-anchor="middle">关闭</text>
</svg>
