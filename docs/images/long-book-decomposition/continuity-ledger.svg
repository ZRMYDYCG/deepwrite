<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="960" height="630" viewBox="0 0 960 630" role="img">
  <title>续写模式：最新一章连续性与伏笔线</title>
  <desc>全书第 1 到 N 章组成一个批次提交，检查点是最新的第 N 章；连续性文件只写在第 N 章；伏笔线的触点挂在具体章节上，随批次提交判定为已发生，伏笔线状态自动推导为已回收、推进中或已埋设。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .h1 { font-size: 20px; font-weight: 600; }
      .lead { font-size: 13px; fill: #5F5E5A; }
      .lbl { font-size: 13px; fill: #444441; }
      .lbl-accent { font-size: 13px; fill: #3C3489; }
      .pl-muted { font-size: 12.5px; fill: #5F5E5A; }
      .beat { font-size: 12px; fill: #3C3489; }
      .ch { font-size: 13px; }
      .pt { font-size: 14px; font-weight: 600; }
      .pl { font-size: 12.5px; fill: #444441; }
      .tag { font-size: 12px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="630" fill="#FFFFFF"/>
  <text class="h1" x="40" y="44">续写模式 · 最新一章连续性与伏笔线</text>
  <text class="lead" x="40" y="68">正文与连续性已写入真实书籍；收尾完成全书批次提交，伏笔状态由已提交触点推导</text>

  <text class="lbl" x="40" y="114">伏笔线 A</text>
  <text class="lbl" x="40" y="154">伏笔线 B</text>
  <text class="lbl" x="40" y="194">伏笔线 C</text>
  <g stroke="#D3D1C7" stroke-width="1.5">
    <line x1="120" y1="110" x2="880" y2="110"/>
    <line x1="120" y1="150" x2="880" y2="150"/>
    <line x1="120" y1="190" x2="880" y2="190"/>
  </g>
  <line x1="277" y1="110" x2="613" y2="110" stroke="#534AB7" stroke-width="3"/>
  <line x1="389" y1="150" x2="501" y2="150" stroke="#534AB7" stroke-width="3"/>
  <line x1="501" y1="150" x2="880" y2="150" stroke="#534AB7" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="780" y1="190" x2="880" y2="190" stroke="#534AB7" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#534AB7" stroke="#FFFFFF" stroke-width="2">
    <circle cx="277" cy="110" r="7"/>
    <circle cx="613" cy="110" r="7"/>
    <circle cx="389" cy="150" r="7"/>
    <circle cx="501" cy="150" r="7"/>
    <circle cx="780" cy="190" r="7"/>
  </g>
  <text class="beat" x="277" y="95" text-anchor="middle">埋</text>
  <text class="beat" x="613" y="95" text-anchor="middle">收</text>
  <text class="beat" x="389" y="135" text-anchor="middle">埋</text>
  <text class="beat" x="501" y="135" text-anchor="middle">推</text>
  <text class="beat" x="780" y="175" text-anchor="middle">埋</text>
  <rect x="890" y="99" width="60" height="22" rx="11" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="tag" x="920" y="115" text-anchor="middle" fill="#085041">已回收</text>
  <rect x="890" y="139" width="60" height="22" rx="11" fill="#FAEEDA" stroke="#854F0B"/>
  <text class="tag" x="920" y="155" text-anchor="middle" fill="#633806">推进中</text>
  <rect x="890" y="179" width="60" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7"/>
  <text class="tag" x="920" y="195" text-anchor="middle" fill="#3C3489">已埋设</text>

  <text class="lbl" x="40" y="270">章节</text>
  <g fill="#F1EFE8" stroke="#888780" stroke-width="1">
    <rect x="120" y="244" width="90" height="44" rx="8"/>
    <rect x="232" y="244" width="90" height="44" rx="8"/>
    <rect x="344" y="244" width="90" height="44" rx="8"/>
    <rect x="568" y="244" width="90" height="44" rx="8"/>
  </g>
  <rect x="456" y="244" width="90" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-dasharray="5 4"/>
  <rect x="680" y="244" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text class="ch" x="165" y="271" text-anchor="middle">第 1 章</text>
  <text class="ch" x="277" y="271" text-anchor="middle">第 2 章</text>
  <text class="ch" x="389" y="271" text-anchor="middle">第 3 章</text>
  <text class="ch" x="501" y="271" text-anchor="middle" fill="#5F5E5A">……</text>
  <text class="ch" x="613" y="271" text-anchor="middle">第 N−1 章</text>
  <text class="ch" x="780" y="271" text-anchor="middle" fill="#085041" font-weight="600">第 N 章（最新）</text>

  <path d="M120 302 V312 H880 V302" fill="none" stroke="#534AB7" stroke-width="1.5"/>
  <text class="lbl-accent" x="500" y="338" text-anchor="middle">一个批次提交（text_files_batch）：第 1–N 章，检查点是第 N 章</text>

  <rect x="40" y="380" width="480" height="220" rx="12" fill="#F7F6F2" stroke="#D3D1C7" stroke-width="1"/>
  <text class="pt" x="60" y="408">提交时的判定</text>
  <text class="pl" x="60" y="438">伏笔线与触点先按“计划中”建好，触点挂到发生的章节</text>
  <text class="pl" x="60" y="464">批次提交把全书触点判定为已发生（committed）</text>
  <text class="pl" x="60" y="490">伏笔线状态由已提交触点推导：已埋设／推进中／已回收</text>
  <text class="pl" x="60" y="516">前面各章只计入批次，不单独写连续性文件</text>
  <text class="pl" x="60" y="542">账本从第 1 章连续覆盖到第 N 章</text>
  <text class="pl" x="60" y="568">长篇智能体据最新状态、交接包和未回收伏笔续写</text>

  <rect x="560" y="380" width="320" height="220" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <text class="pt" x="580" y="408" fill="#085041">第 N 章的连续性文件</text>
  <text class="pl" x="580" y="438">character_state · 章末人物状态</text>
  <text class="pl" x="580" y="464">handoff · 下一章交接包</text>
  <text class="pl" x="580" y="490">foreshadowing_changes · 伏笔变化</text>
  <text class="pl" x="580" y="516">world_reveals · 世界观揭示（可选）</text>
  <text class="pl" x="580" y="542">主要人物 current_state ／ history</text>
  <text class="pl-muted" x="580" y="576">由连续性记录员和人物档案师产出</text>
  <path d="M880 266 H920 V490 H884" fill="none" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
