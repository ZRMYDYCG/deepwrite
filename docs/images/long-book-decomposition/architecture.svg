<svg xmlns="http://www.w3.org/2000/svg" fill="#2C2C2A" width="960" height="770" viewBox="0 0 960 770" role="img">
  <title>长篇整书拆解进程与数据流</title>
  <desc>开始前经 Main/Core 创建并绑定真实目标。Agent 查询与专用提交都经 Main 授权，Core 按单元直接保存真实书籍或素材、原子写入回执，再通知界面。任务文件只保存轻量状态。</desc>
  <defs>
    <style>
      svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; }
      .h1 { font-size: 20px; font-weight: 600; }
      .lead { font-size: 13px; fill: #5F5E5A; }
      .bt { font-size: 15px; font-weight: 600; }
      .sbt { font-size: 13.5px; font-weight: 600; }
      .sbs { font-size: 12px; }
      .line { font-size: 12.5px; }
      .lbl { font-size: 12px; fill: #5F5E5A; }
      .r-t { fill: #0C447C; } .r-s { fill: #185FA5; }
      .m-s { fill: #5F5E5A; }
      .a-t { fill: #3C3489; } .a-s { fill: #534AB7; }
      .c-t { fill: #085041; } .c-s { fill: #0F6E56; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="770" fill="#FFFFFF"/>
  <text class="h1" x="40" y="44">长篇整书拆解 · 进程与数据流</text>
  <text class="lead" x="40" y="68">沿用现有分层：Renderer 只发契约命令，凭据只在 Main 与 Agent，Core 是唯一写入者</text>

  <rect x="40" y="92" width="880" height="118" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="bt r-t" x="60" y="118">Renderer · extras/long-book-decomposition/</text>
  <g fill="#FFFFFF" stroke="#85B7EB" stroke-width="1">
    <rect x="60" y="132" width="260" height="64" rx="8"/>
    <rect x="350" y="132" width="260" height="64" rx="8"/>
    <rect x="640" y="132" width="260" height="64" rx="8"/>
  </g>
  <text class="sbt r-t" x="190" y="157" text-anchor="middle">拆解页面</text>
  <text class="sbs r-s" x="190" y="181" text-anchor="middle">设置 · 运行进度 · 名册 · 真实成果</text>
  <text class="sbt r-t" x="480" y="157" text-anchor="middle">工作流控制器</text>
  <text class="sbs r-s" x="480" y="181" text-anchor="middle">推进阶段 · 覆盖校验 · 续跑重试</text>
  <text class="sbt r-t" x="770" y="157" text-anchor="middle">目标与成果</text>
  <text class="sbs r-s" x="770" y="181" text-anchor="middle">选择／新建目标 · 打开／编辑真实内容</text>

  <line x1="300" y1="212" x2="300" y2="242" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="310" y="232">命令</text>
  <line x1="660" y1="242" x2="660" y2="214" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="670" y="232">事件</text>

  <rect x="40" y="246" width="880" height="44" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/>
  <text class="line" x="480" y="273" text-anchor="middle" fill="#444441">Preload · extrasAgents.run · longBookDecomposition.*（请求与响应双向校验）</text>

  <line x1="300" y1="292" x2="300" y2="326" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="310" y="314">命令</text>
  <line x1="660" y1="326" x2="660" y2="294" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="670" y="314">事件</text>

  <rect x="40" y="330" width="880" height="140" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="bt" x="60" y="356">Main · src/extras/agents ＋ 内部命令授权</text>
  <g fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1">
    <rect x="50" y="370" width="200" height="84" rx="8"/>
    <rect x="270" y="370" width="200" height="84" rx="8"/>
    <rect x="490" y="370" width="200" height="84" rx="8"/>
    <rect x="710" y="370" width="200" height="84" rx="8"/>
  </g>
  <text class="sbt" x="150" y="393" text-anchor="middle">task-resolver</text>
  <text class="sbs m-s" x="150" y="415" text-anchor="middle">校验目标已准备、阶段</text>
  <text class="sbs m-s" x="150" y="435" text-anchor="middle">与方案，绑定 jobId</text>
  <text class="sbt" x="370" y="393" text-anchor="middle">运行登记</text>
  <text class="sbs m-s" x="370" y="415" text-anchor="middle">activeRuns 记 jobId</text>
  <text class="sbs m-s" x="370" y="435" text-anchor="middle">用量归入整书拆解</text>
  <text class="sbt" x="590" y="393" text-anchor="middle">内部命令授权</text>
  <text class="sbs m-s" x="590" y="415" text-anchor="middle">只放行本任务、本包</text>
  <text class="sbs m-s" x="590" y="435" text-anchor="middle">的查询与受控提交</text>
  <text class="sbt" x="810" y="393" text-anchor="middle">任务命令路由</text>
  <text class="sbs m-s" x="810" y="415" text-anchor="middle">准备目标 · 直接写入</text>
  <text class="sbs m-s" x="810" y="435" text-anchor="middle">转发给 Core</text>

  <line x1="120" y1="472" x2="120" y2="516" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="128" y="500">agent.extras_run</text>
  <line x1="300" y1="518" x2="300" y2="474" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="308" y="500">事件</text>
  <line x1="400" y1="518" x2="400" y2="474" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="408" y="500">读取／提交</text>
  <line x1="600" y1="472" x2="600" y2="516" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="608" y="500">授权后转发</text>
  <line x1="800" y1="472" x2="800" y2="516" stroke="#73726C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text class="lbl" x="808" y="500">真实写入</text>

  <rect x="40" y="520" width="420" height="200" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="bt a-t" x="60" y="548">Agent Utility · planExtrasRun</text>
  <text class="line a-s" x="60" y="578">阶段主控：ContextPolicy「整书拆解」压缩上下文</text>
  <text class="line a-s" x="60" y="604">spawn_subagent：每次 ≤20 个任务，同时 ≤5 个</text>
  <text class="line a-s" x="60" y="630">子智能体：通读员、名册员、编年员、档案师……</text>
  <text class="line a-s" x="60" y="656">提交工具 → Main 受控提交桥 → Core 回执</text>
  <text class="line a-s" x="60" y="682">保存成功后 → 产出／进度通知 → 界面刷新</text>

  <rect x="500" y="520" width="420" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="bt c-t" x="520" y="548">Core Utility</text>
  <text class="line c-s" x="520" y="578">真实书籍／素材：原子保存内容与回执</text>
  <text class="line c-s" x="520" y="604">轻量任务状态：按真实回执恢复进度</text>
  <text class="line c-s" x="520" y="630">续写：逐章／对象保存，最后完成账本</text>
  <text class="line c-s" x="520" y="656">素材：开始前建库，按单元更新条目</text>
  <text class="line c-s" x="520" y="682">查询真实产物；任务状态不存结果副本</text>

  <text class="lbl" x="40" y="752">Agent 只能读取并提交本包结果，不能直接写文件；Main 授权固定目标，Core 原子保存，界面即时看到真实成果</text>
</svg>
